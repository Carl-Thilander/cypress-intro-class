

on:
  pull_request:
    branches: [ "lecture" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
      env: 
       DATABASE_URL=mongodb://localhost:27017/
    - run: npm run test:run 
